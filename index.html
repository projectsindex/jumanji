<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecosistema</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body data-tema="clasico">
    <div id="loader">
        <div class="loader-text">inicializando ecosistema...</div>
        <div class="loader-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <div id="terminal-container"></div>
    <div id="pulso"></div>

    <script>
        // Si algún CDN falla antes de que el juego despierte,
        // que el loader al menos lo diga.
        window.addEventListener('error', function () {
            if (window.__ecoListo) return;
            var t = document.querySelector('.loader-text');
            if (t) t.textContent = 'error al despertar. recargá la página.';
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

    <script>
        // Temas de xterm. Los colores ANSI (amarillo/rojo/verde) se
        // definen por tema para que se lean bien en todos, incluso papel.
        const TEMAS = {
            clasico:  { background: '#000000', foreground: '#00ff00', cursor: '#00ff00',
                        selectionBackground: '#004400',
                        red: '#ff4444', yellow: '#ffff00', green: '#00aa00', brightGreen: '#00ff00' },
            amanecer: { background: '#1a1a2e', foreground: '#ff9a3c', cursor: '#ff9a3c',
                        selectionBackground: '#4a2a4e',
                        red: '#ff6b6b', yellow: '#ffd93c', green: '#a8e063', brightGreen: '#c6ff8a' },
            bosque:   { background: '#0a1a0a', foreground: '#7fff7f', cursor: '#7fff7f',
                        selectionBackground: '#1e4020',
                        red: '#ff7a6b', yellow: '#e6e27a', green: '#4caf50', brightGreen: '#7fff7f' },
            oceano:   { background: '#001a33', foreground: '#66ccff', cursor: '#66ccff',
                        selectionBackground: '#0a3355',
                        red: '#ff7a7a', yellow: '#ffe27a', green: '#3fd97f', brightGreen: '#7dffb0' },
            papel:    { background: '#f5f5dc', foreground: '#1a1a1a', cursor: '#1a1a1a',
                        selectionBackground: '#d8d4a8',
                        red: '#c62828', yellow: '#b58900', green: '#2e7d32', brightGreen: '#388e3c' }
        };

        // La luz que dejaste la última vez, antes de que Python despierte.
        function temaGuardado() {
            try {
                const crudo = localStorage.getItem('ecosistema_estado');
                if (!crudo) return 'clasico';
                const t = JSON.parse(crudo).tema;
                return TEMAS[t] ? t : 'clasico';
            } catch (e) {
                return 'clasico';
            }
        }

        const temaInicial = temaGuardado();
        document.body.setAttribute('data-tema', temaInicial);

        const term = new Terminal({
            cursorBlink: true,
            fontSize: 16,
            fontFamily: "'Courier New', Courier, monospace",
            theme: TEMAS[temaInicial],
            scrollback: 1000
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();
        window.addEventListener('resize', () => fitAddon.fit());
        document.addEventListener('click', () => term.focus());

        // ------------------------------------------------------
        // Puente eco_*: lo único que Python conoce del navegador
        // ------------------------------------------------------

        // escritura cruda, sin salto de línea (eco de teclas, prompt)
        window.eco_write = function (texto) {
            term.write(texto);
        };

        // una línea completa, con estilo
        window.eco_writeln = function (texto, estilo) {
            if (estilo === 'sistema') {
                term.writeln('\x1b[33m' + texto + '\x1b[0m');   // amarillo
            } else if (estilo === 'error') {
                term.writeln('\x1b[31m' + texto + '\x1b[0m');   // rojo
            } else if (estilo === 'exito') {
                term.writeln('\x1b[92m' + texto + '\x1b[0m');   // verde brillante
            } else {
                term.writeln(texto);
            }
        };

        window.eco_limpiar = function () {
            term.clear();
        };

        // devuelve una Promise: Python la espera con `await`
        window.eco_pausa = function (ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        };

        window.eco_set_tema = function (tema) {
            if (!TEMAS[tema]) return;
            document.body.setAttribute('data-tema', tema);
            term.options.theme = TEMAS[tema];
        };

        // ------------------------------------------------------
        // arranque
        // ------------------------------------------------------

        let juego = null;
        let listo = false;
        let cola = Promise.resolve();

        // Las teclas se procesan en fila: una a la vez, sin entreverarse.
        term.onData((data) => {
            if (!listo || !juego) return;
            cola = cola
                .then(() => juego.procesar_input(data))
                .catch((err) => console.error(err));
        });

        async function iniciar() {
            try {
                window.eco_writeln('cargando motor...', 'sistema');
                const pyodide = await loadPyodide();
                window.eco_writeln('motor cargado.', 'sistema');

                const respuesta = await fetch('juego.py');
                if (!respuesta.ok) {
                    throw new Error(
                        'no se pudo leer juego.py (HTTP ' + respuesta.status +
                        '). ¿está subido junto a index.html?'
                    );
                }
                const codigo = await respuesta.text();
                await pyodide.runPythonAsync(codigo);

                const Juego = pyodide.globals.get('Juego');
                juego = Juego();

                window.eco_limpiar();
                await juego.iniciar();

                listo = true;
                window.__ecoListo = true;
                document.getElementById('loader').style.display = 'none';
                fitAddon.fit();
                term.focus();
            } catch (error) {
                console.error(error);
                document.getElementById('loader').style.display = 'none';
                window.eco_writeln('');
                window.eco_writeln('la máquina no pudo despertar.', 'error');
                window.eco_writeln('error: ' + error.message, 'error');
                window.eco_writeln(
                    'revisá tu conexión, recargá la página e intentá de nuevo.',
                    'sistema'
                );
            }
        }

        iniciar();
    </script>
</body>
</html>
